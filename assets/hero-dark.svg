<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="ttl">
  <title id="ttl">Maverick Cui — AI Solution Architect at ByteDance</title>
  <defs>
    <pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#6FD6A8" opacity="0.16"/>
    </pattern>
    <clipPath id="plate">
      <rect x="712" y="48" width="332" height="204"/>
    </clipPath>
  </defs>

  <rect width="1100" height="300" fill="#0C1512"/>

  <!-- signal plate -->
  <rect x="712" y="48" width="332" height="204" fill="url(#dots)"/>
  <g clip-path="url(#plate)" fill="none" stroke="#6FD6A8">
    <circle cx="1044" cy="252" r="56"  stroke-width="1.1" opacity="0.36"/>
    <circle cx="1044" cy="252" r="102" stroke-width="1.1" opacity="0.29"/>
    <circle cx="1044" cy="252" r="148" stroke-width="1.1" opacity="0.22"/>
    <circle cx="1044" cy="252" r="194" stroke-width="1.1" opacity="0.15"/>
    <circle cx="1044" cy="252" r="240" stroke-width="1.1" opacity="0.11"/>
  </g>
  <rect x="712" y="48" width="332" height="204" fill="none" stroke="#22332C"/>
  <circle cx="712" cy="48" r="4" fill="#C4586A"/>

  <!-- type -->
  <line x1="56" y1="48" x2="688" y2="48" stroke="#22332C"/>
  <text x="56" y="82" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" letter-spacing="3.4" fill="#85958D">AI SOLUTION ARCHITECT · BYTEDANCE</text>

  <text x="55" y="170" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="72" font-weight="700" fill="#ECE7DD">Maverick Cui</text>

  <text x="57" y="214" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="20" font-style="italic" fill="#B4AFA4">I architect the systems that turn frontier models into shipped products.</text>

  <line x1="56" y1="252" x2="1044" y2="252" stroke="#22332C"/>
  <text x="56" y="277" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1.9" fill="#85958D">BEIJING / SHENZHEN&#160;&#160;·&#160;&#160;9× HACKATHON WINNER&#160;&#160;·&#160;&#160;42+ CLOUD &amp; AI CERTIFICATIONS</text>
